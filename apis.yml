apis:
- aid: university-of-manchester:pure-oai-pmh
  name: Research Explorer OAI-PMH (Pure)
  description: >-
    Live OAI-PMH 2.0 metadata harvesting endpoint for the University of Manchester's Pure-based institutional
    repository / Current Research Information System (CRIS). The Identify response confirms a "Pure OAI
    Repository" running protocol version 2.0, exposing research output metadata for harvesting via standard
    verbs (Identify, ListRecords, ListMetadataFormats, etc.).
  humanURL: https://research.manchester.ac.uk/
  baseURL: https://pure.manchester.ac.uk/ws/oai
  tags:
  - Research
  - OAI-PMH
  - Repository
  - Metadata
  - Open Access
  properties:
  - type: Documentation
    url: https://research.manchester.ac.uk/
- aid: university-of-manchester:research-explorer
  name: Research Explorer Portal
  description: >-
    Public Pure portal exposing the University of Manchester's researcher profiles, research outputs,
    projects, research units, impacts and theses. It is a discovery front end over the Pure CRIS rather
    than a documented programmatic API, but it is the canonical public surface of the institution's research
    data.
  humanURL: https://research.manchester.ac.uk/
  baseURL: https://research.manchester.ac.uk/
  tags:
  - Research
  - Discovery
  - Portal
  - Pure
  properties:
  - type: Documentation
    url: https://research.manchester.ac.uk/
- aid: university-of-manchester:figshare
  name: Research Data Repository (Figshare)
  description: >-
    The University of Manchester uses Figshare as its institutional research data repository for depositing
    and openly publishing research datasets. Figshare exposes a public, documented REST API; Manchester's
    deposits are discoverable through it, though the University does not operate the API surface itself.
  humanURL: https://www.openresearch.manchester.ac.uk/research-services/research-data-management/
  baseURL: https://api.figshare.com/v2
  tags:
  - Research Data
  - Repository
  - Figshare
  - REST
  - Open Data
  properties:
  - type: Documentation
    url: https://docs.figshare.com/
- aid: university-of-manchester:shibboleth-sso
  name: Shibboleth SAML Identity (SSO)
  description: >-
    The University of Manchester provides federated authentication via a Shibboleth SAML2 Identity Provider
    at shib.manchester.ac.uk, participating in the Jisc UK Access Management Federation. This is institutional
    SSO infrastructure for staff, students and federated e-resources rather than a public OAuth developer
    API.
  humanURL: https://shib.manchester.ac.uk/
  tags:
  - Identity
  - SSO
  - SAML
  - Shibboleth
  - Authentication
  properties:
  - type: Documentation
