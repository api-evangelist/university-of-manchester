aid: university-of-manchester
name: University of Manchester
description: 'The University of Manchester is a public research university in Manchester, England, a founding
  member of the Russell Group and, on the QS World University Rankings, a consistent global top-40 institution.
  Its programmable footprint is small, real, and almost entirely mis-stated by its own domain names. The
  University operates exactly three machine-readable surfaces of its own: a IIIF Presentation API and
  a IIIF Image API serving the John Rylands Library''s digitised manuscripts from the University''s own
  hosts and its own JANET address space, and a Shibboleth SAML 2.0 Identity Provider registered in the
  Jisc UK Access Management Federation under entityID https://shib.manchester.ac.uk/shibboleth. Everything
  else that looks like a Manchester API is a tenancy: pure.manchester.ac.uk and research.manchester.ac.uk
  both CNAME to uom-aws.elsevierpure.com and serve Elsevier''s Pure product API and OAI-PMH implementation;
  figshare.manchester.ac.uk CNAMEs to figshare.com. Those are Manchester''s records on a supplier''s platform,
  under a supplier''s contract, and they are recorded here as tenant relationships rather than credited
  as the University''s engineering. There is no central developer portal, no self-service API keys, no
  open data portal at data.manchester.ac.uk, and no public course, timetable or SIS API. Thirty-six OpenAPI
  documents previously held in this repository were Elsevier''s Pure 5.35.2-2 specification split by tag
  and re-titled; they have been quarantined, not counted.'
