apis:
- aid: university-of-manchester:shibboleth-saml-idp
  name: Shibboleth SAML Identity Provider (UK Access Management Federation)
  description: >-
    The University's own Shibboleth Identity Provider, entityID https://shib.manchester.ac.uk/shibboleth,
    asserting the scope manchester.ac.uk. Its entity descriptor is published as signed, machine-readable
    SAML metadata through the Jisc UK Access Management Federation MDQ service and onward into eduGAIN
    — retrieved live on 2026-08-19 (200, 9647 bytes) and saved to this repo. Advertises SAML 2.0, SAML
    1.1 and the native Shibboleth authn profile over HTTP-Redirect, HTTP-POST, HTTP-POST-SimpleSign and
    SOAP artifact resolution. Institution-operated by definition, and the single most under-catalogued
    programmable asset a university runs. Note that the IdP is not a public developer API: an application
    cannot obtain an assertion without being registered as a service provider in the federation.
  humanURL: https://www.itservices.manchester.ac.uk/
  baseURL: http://mdq.ukfederation.org.uk/entities/https%3A%2F%2Fshib.manchester.ac.uk%2Fshibboleth
  tags:
  - Identity
  - SSO
  - SAML
  - Shibboleth
  - Federation
  - eduGAIN
  properties:
  - type: Authentication
    url: authentication/university-of-manchester-authentication.yml
  - type: IdentityFederation
    url: http://mdq.ukfederation.org.uk/entities/https%3A%2F%2Fshib.manchester.ac.uk%2Fshibboleth
  - type: Documentation
    url: https://www.itservices.manchester.ac.uk/
  x-operator: institution
  x-operator-evidence: >-
    Signed EntityDescriptor from the UK Access Management Federation names OrganizationName 'The University
    of Manchester' and shibmd:Scope 'manchester.ac.uk'; shib.manchester.ac.uk resolves to 130.88.36.102
    in the University's own address space.
  x-sso-endpoint: https://shib.manchester.ac.uk/shibboleth-idp/profile/SAML2/Redirect/SSO
  x-entity-id: https://shib.manchester.ac.uk/shibboleth
  x-probe:
    baseURL_status: 200
    note: >-
      baseURL is the federation MDQ location because that is the machine-readable artifact an agent can
      actually retrieve — 200, 9647 bytes of signed SAML metadata. The SSO endpoint itself returns 500
      to a bare GET because it requires a SAMLRequest; that is protocol behaviour, not an outage, and
      it is recorded in x-sso-endpoint rather than as a pointer.
    sso_endpoint_bare_get_status: 500
    probed: '2026-08-19'
- aid: university-of-manchester:pure-cris-tenancy
  name: Elsevier Pure CRIS tenancy (REST + OAI-PMH)
  description: >-
    The University's tenancy of Elsevier Pure, its Current Research Information System, reached at pure.manchester.ac.uk
    and surfaced publicly as Research Explorer at research.manchester.ac.uk. Both hostnames CNAME to uom-aws.elsevierpure.com.
    The OAI-PMH 2.0 endpoint is live and fully functional — Identify returns repositoryName 'Pure OAI
    Repository' with adminEmail Pure@manchester.ac.uk and an earliest datestamp of 2016-03-17, ListMetadataFormats
    offers seven formats including oai_cerif_openaire and uketd_dc, and ListRecords returns real batches.
    The REST API is documented at /ws/api and gated by an api-key header. All of that is Manchester's
    data and Manchester's administration on Elsevier's platform under Elsevier's contract: the specification
    declares info.title 'Pure API', info.contact.email pure-support@elsevier.com and info.version 5.35.2-2,
    with a relative servers[] entry naming no institution at all. Recorded here as a tenant relationship.
    The specification itself is not held under this slug.
  humanURL: https://research.manchester.ac.uk/
  baseURL: https://pure.manchester.ac.uk/ws/oai
