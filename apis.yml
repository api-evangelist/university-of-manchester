  reason: institution_operated_contract
  detail: 'Three institution-operated surfaces found and verified by live probe on 2026-08-19: the IIIF
    Presentation API and IIIF Image API at Manchester Digital Collections (both on the University''s own
    hosts inside its own JANET address space, both returning genuine 404s on negative probes against real
    path shapes), and the Shibboleth SAML 2.0 Identity Provider whose signed entity descriptor was retrieved
    from the UK Access Management Federation MDQ service. Two contracts were written from those probes
    and saved. Two further surfaces, spanning three hostnames, are real but tenant-operated and are recorded
    as relationships without holding the supplier''s specification: the Elsevier Pure tenancy (pure.manchester.ac.uk
    and research.manchester.ac.uk, both CNAME uom-aws.elsevierpure.com) and the Figshare tenancy (figshare.manchester.ac.uk
    CNAME figshare.com). The profile is thin because the institution is thin, not because the probe was:
    no open data portal exists (data.manchester.ac.uk and opendata.manchester.ac.uk do not resolve), no
    api.manchester.ac.uk or developer.manchester.ac.uk exists, and no public course, timetable or SIS
    API was found. Thirty-six OpenAPI documents previously scored under this slug were Elsevier''s Pure
    5.35.2-2 specification split by tag; they are quarantined in _vendor-quarantine/ with the evidence.'
  assessed: '2026-08-19'
  method: pipeline-university + live probe
