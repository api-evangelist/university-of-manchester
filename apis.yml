    because its verdict is host-name based. That heuristic cannot see a vanity CNAME: it reports pure.manchester.ac.uk
    and figshare.manchester.ac.uk as institution when DNS shows them pointing at uom-aws.elsevierpure.com
    and figshare.com. The x-operator values in this file are set from DNS plus the specification''s own
    self-declaration, not from the script, and they should be treated as the authority where the two disagree.
    The same blind spot will under-count tenants across the rest of the cohort wherever an institution
