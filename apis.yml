  x-vendor: Elsevier (Pure)
- aid: university-of-manchester:figshare-tenancy
  name: Figshare research data repository tenancy
  description: >-
    The University's institutional research data repository, presented at figshare.manchester.ac.uk, which
    CNAMEs to figshare.com. Manchester's researchers deposit here and the deposits carry Manchester's
    branding, but the platform, the REST API and the DOI minting are Figshare's. Probed 2026-08-19: the
    tenant host returns an AWS WAF interstitial (HTTP 202) rather than a page body — a bot challenge,
    which grades as live-and-blocked, not dead. Recorded as a tenant relationship; the generic api.figshare.com/v2
    contract that previously appeared under this slug is a vendor surface and has been removed. One Figshare
    contract was at one point attributed to twenty-five separate universities in this catalog; this entry
    exists so the relationship survives the correction without the misattribution.
  humanURL: https://www.openresearch.manchester.ac.uk/
  baseURL: https://figshare.manchester.ac.uk/
