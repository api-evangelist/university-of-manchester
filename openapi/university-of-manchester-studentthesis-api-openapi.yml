openapi: 3.2.0
info:
  title: University Of Manchester Student Thesis API
  version: 5.35.2-2
  contact:
    name: ''
    url: ''
    email: pure-support@elsevier.com
  license:
    name: ''
    url: ''
  termsOfService: ''
  description: 'Operations tagged studentThesis across 2 of this provider''s published API definitions: university-of-manchester-pure-rest.yaml, university-of-manchester-pure-rest.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: /ws/api
security:
- api-key: []
tags:
- name: studentThesis
paths:
  /student-theses:
    get:
      tags:
      - studentThesis
      summary: Lists all student theses
      description: Lists all student theses in the Pure instance. If you need to filter the student theses returned, see the POST version which supports additional filtering.
      operationId: studentThesis_list
      parameters:
      - name: size
        in: query
        description: Number of returned  student theses per request.
        schema:
          maximum: 1000
          type: integer
          format: int32
          default: 10
      - name: offset
        in: query
        description: The offset for the returned list. 0 or null value is from the start
        schema:
          type: integer
          format: int32
          default: 0
      - name: order
        in: query
        description: The order of the list, must be a value from /student-theses/orderings
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentThesisListResult'
    put:
      tags:
      - studentThesis
      summary: Create student thesis
      operationId: studentThesis_create
      requestBody:
        description: The content to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentThesis'
        required: true
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentThesis'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    servers:
    - url: /ws/api
  /student-theses/allowed-contributor-countries:
    get:
      tags:
      - studentThesis
      summary: A list of allowed contributor countries for student theses
      description: Get a list of allowed countries for contributors of student theses
      operationId: studentthesis_getAllowedContributorCountries
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRefList'
    servers:
    - url: /ws/api
  /student-theses/allowed-contributor-roles:
    get:
      tags:
      - studentThesis
      summary: A list of allowed contributor roles for student theses
      description: Get a list of allowed roles for contributors of student theses
      operationId: studentthesis_getAllowedContributorRoles
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRefList'
    servers:
    - url: /ws/api
  /student-theses/allowed-custom-defined-field-values/{fieldIdentifer}/classifications:
    get:
      tags:
      - studentThesis
      summary: Get allowed classifications for the custom-defined field associated with the…
      description: Get allowed classifications for the custom-defined field associated with the student theses.
      operationId: studentThesis_getAllowedCustomDefinedFieldClassifications
      parameters:
      - name: fieldIdentifer
        in: path
        description: FieldIdentifer for the desired custom-defined field
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRefList'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    servers:
    - url: /ws/api
  /student-theses/allowed-document-embargo-reasons:
    get:
      tags:
      - studentThesis
      summary: A list of allowed document embargo reasons
      description: Get a list of allowed document embargo reasons that can be used for student theses
      operationId: studentThesis_getAllowedDocumentEmbargoReasons
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRefList'
    servers:
    - url: /ws/api
  /student-theses/allowed-document-license-types:
    get:
      tags:
      - studentThesis
      summary: A list of allowed document license types
      description: Get a list of allowed document license types that can be used for student these
      operationId: studentThesis_getAllowedDocumentLicenses
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRefList'
    servers:
    - url: /ws/api
  /student-theses/allowed-document-types:
    get:
      tags:
      - studentThesis
      summary: A list of allowed document types
      description: Get a list of allowed document types that can be used for student these
      operationId: studentThesis_getAllowedDocumentTypes
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRefList'
    servers:
    - url: /ws/api
  /student-theses/allowed-document-version-types:
    get:
      tags:
      - studentThesis
      summary: A list of allowed document version types
      description: Get a list of allowed document version types that can be used for student these
      operationId: studentThesis_getAllowedDocumentVersionTypes
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRefList'
    servers:
    - url: /ws/api
  /student-theses/allowed-image-types:
    get:
      tags:
      - studentThesis
      summary: A list of allowed image types
      description: Get a list of allowed image types that can be used for the 'images.type' attribute of student thesis
      operationId: studentThesis_getAllowedImageTypes
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRefList'
    servers:
    - url: /ws/api
  /student-theses/allowed-keyword-group-configurations:
    get:
      tags:
      - studentThesis
      summary: A list of keyword group configurations
      description: Get a list of allowed keyword group configurations that can be used when submitting keyword groups.
      operationId: studentThesis_getAllowedKeywordGroupConfigurations
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowedKeywordGroupConfigurationList'
    servers:
    - url: /ws/api
  /student-theses/allowed-keyword-group-configurations/{id}/classifications:
    get:
      tags:
      - studentThesis
      summary: A list of allowed classifications for the specified keyword group
      description: Get a list of allowed classifications that can be used when submitting a specified keyword group.
      operationId: studentThesis_getAllowedKeywordGroupConfigurationClassifications
      parameters:
      - name: id
        in: path
        description: Pure id of the keyword group configuration
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRefList'
    servers:
    - url: /ws/api
  /student-theses/allowed-languages:
    get:
      tags:
      - studentThesis
      summary: A list of allowed languages
      description: Get a list of allowed languages on student theses
      operationId: studentthesis_getAllowedLanguages
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRefList'
    servers:
    - url: /ws/api
  /student-theses/allowed-link-types:
    get:
      tags:
      - studentThesis
      summary: A list of allowed link types
      description: Get a list of allowed link types on student theses
      operationId: studentthesis_getAllowedLinkTypes
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRefList'
    servers:
    - url: /ws/api
  /student-theses/allowed-locales:
    get:
      tags:
      - studentThesis
      summary: A list of allowed locales in localized strings
      description: Get a list of allowed locales that can be used when submitting localized string entities.
      operationId: studentThesis_getAllowedLocales
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalesList'
    servers:
    - url: /ws/api
  /student-theses/allowed-supervisor-roles:
    get:
      tags:
      - studentThesis
      summary: A list of allowed supervisor roles
      description: Get a list of allowed supervisors roles for student theses
      operationId: studentthesis_getAllowedSupervisorRoles
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRefList'
    servers:
    - url: /ws/api
  /student-theses/allowed-types:
    get:
      tags:
      - studentThesis
      summary: A list of allowed student thesis types
      description: Get a list of allowed types that can be used for the 'type' attribute of student theses
      operationId: studentThesis_getAllowedTypes
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRefList'
    servers:
    - url: /ws/api
  /student-theses/allowed-workflow-steps:
    get:
      tags:
      - studentThesis
      summary: A list of allowed workflow steps
      description: Get a list of allowed workflow steps that can be used for the 'workflow' attribute of student theses
      operationId: studentThesis_getAllowedWorkflowSteps
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResult'
    servers:
    - url: /ws/api
  /student-theses/file-uploads:
    put:
      tags:
      - studentThesis
      summary: Upload file to a specific student thesis
      description: Uploads file for the student thesis
      operationId: studentThesis_fileUploads
      parameters:
      - name: Content-Type
        in: header
        description: Set the mime type for the file
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              format: binary
        required: true
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFile'
            application/xml:
              schema:
                $ref: '#/components/schemas/UploadedFile'
    servers:
    - url: /ws/api
  /student-theses/orderings:
    get:
      tags:
      - studentThesis
      summary: Lists available orderings
      description: Lists all orderings available to the student thesis endpoint. These values can be used by the order parameter.
      operationId: studentThesis_getOrderings
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderingsList'
    servers:
    - url: /ws/api
  /student-theses/search:
    post:
      tags:
      - studentThesis
      summary: Query operation for student theses
      description: Lists student theses in the Pure instance that matches the provided query, similar to the GET version, instead of using parameters to alter the response, an JSON document is posted with the request. The JSON document contains fields for all the parameters available for the GET version, but also additional filtering options.
      operationId: studentThesis_query
      requestBody:
        description: The query to perform
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentThesesQuery'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentThesisListResult'
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    servers:
    - url: /ws/api
  /student-theses/{uuid}:
    get:
      tags:
      - studentThesis
      summary: Get student thesis
      description: Get student thesis with specific UUID.
      operationId: studentThesis_get
      parameters:
      - name: uuid
        in: path
        description: UUID of the desired student thesis
        required: true
        schema:
          pattern: .+
          type: string
          format: uuid
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentThesis'
        '301':
          description: The requested content have changed UUID
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags:
      - studentThesis
      summary: Update student thesis
      description: Update student thesis with specific UUID.
      operationId: studentThesis_update
      parameters:
      - name: uuid
        in: path
        description: UUID of the student thesis to update
        required: true
        schema:
          pattern: .+
          type: string
          format: uuid
      requestBody:
        description: The content to update
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentThesis'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentThesis'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Version conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblemDetails'
    delete:
      tags:
      - studentThesis
      summary: Delete student thesis
      description: Delete student thesis with specific UUID.
      operationId: studentThesis_delete
      parameters:
      - name: uuid
        in: path
        description: UUID of the student thesis
        required: true
        schema:
          pattern: .+
          type: string
          format: uuid
      responses:
        '204':
          description: Successful operation
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblemDetails'
    servers:
    - url: /ws/api
  /student-theses/{uuid}/actions/lock:
    post:
      tags:
      - studentThesis
      summary: Lock the content
      description: Mark the content as external (used when content contains synchronised data). This has no effect on interactions with the content through the API.
      operationId: studentThesis_lock
      parameters:
      - name: uuid
        in: path
        description: UUID of the student thesis to lock
        required: true
        schema:
          pattern: .+
          type: string
          format: uuid
      responses:
        '204':
          description: Content marked as locked
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Content already locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblemDetails'
    servers:
    - url: /ws/api
  /student-theses/{uuid}/actions/unlock:
    post:
      tags:
      - studentThesis
      summary: Unlock the content
      description: Remove the external mark on the content (used when content contains synchronised data). This has no effect on interactions with the content through the API.
      operationId: studentThesis_unlock
      parameters:
      - name: uuid
        in: path
        description: UUID of the student thesis to unlock
        required: true
        schema:
          pattern: .+
          type: string
          format: uuid
      responses:
        '204':
          description: Content marked as unlocked
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Content already unlocked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblemDetails'
    servers:
    - url: /ws/api
  /student-theses/{uuid}/dependents:
    get:
      tags:
      - studentThesis
      summary: Lists all dependents to a student thesis
      description: Lists all dependents to a student thesis with the specified UUID. If the user does not have access to view all the dependent content, an authorization error will be thrown.
      operationId: studentThesis_dependents
      parameters:
      - name: uuid
        in: path
        description: UUID of the student thesis
        required: true
        schema:
          pattern: .+
          type: string
          format: uuid
      - name: verbose
        in: query
        description: DEPRECATED - Parameter has no effect.
        deprecated: true
        schema:
          type: boolean
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentRefListResult'
    servers:
    - url: /ws/api
  /student-theses/{uuid}/files/{fileId}:
    get:
      tags:
      - studentThesis
      summary: Get file from the student thesis
      operationId: studentThesis_getFile
      parameters:
      - name: uuid
        in: path
        description: UUID of the student thesis
        required: true
        schema:
          pattern: .+
          type: string
          format: uuid
      - name: fileId
        in: path
        description: 'File id '
        required: true
        schema:
          pattern: .+
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            '*/*':
              schema:
                type: string
                format: binary
    servers:
    - url: /ws/api
  /student-theses/{uuid}/notes:
    get:
      tags:
      - studentThesis
      summary: Lists notes
      description: Lists notes associated with a student thesis ordered by date (nulls last)
      operationId: studentThesis_listNotes
      parameters:
      - name: uuid
        in: path
        description: UUID of the student thesis to get notes for
        required: true
        schema:
          pattern: .+
          type: string
          format: uuid
      - name: size
        in: query
        description: Number of returned notes per request
        schema:
          maximum: 1000
          type: integer
          format: int32
          default: 10
      - name: offset
        in: query
        description: The offset for the returned list. 0 or null value is from the start
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteListResult'
        '404':
          description: student thesis not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags:
      - studentThesis
      summary: Create note
      description: Create note and associate it with a student thesis
      operationId: studentThesis_createNote
      parameters:
      - name: uuid
        in: path
        description: UUID of the student thesis to add note to
        required: true
        schema:
          pattern: .+
          type: string
          format: uuid
      requestBody:
        description: The note to create
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Note'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    servers:
    - url: /ws/api
components:
  schemas:
    AllowedKeywordGroupConfigurationList:
      type: object
      properties:
        configurations:
          type: array
          items:
            $ref: '#/components/schemas/AllowedKeywordGroupConfiguration'
      description: List of allowed keyword group configurations
    SupervisorAssociation:
      required:
      - role
      type: object
      properties:
        pureId:
          type: integer
          description: Pure database ID of the object, prefer using the UUID if it is present on the entity
          format: int64
          readOnly: true
        externalOrganizations:
          type:
          - array
          - 'null'
          description: A collection of external organization affiliations.
          items:
            $ref: '#/components/schemas/ExternalOrganizationRef'
        name:
          $ref: '#/components/schemas/Name'
        person:
          $ref: '#/components/schemas/PersonRef'
        externalPerson:
          $ref: '#/components/schemas/ExternalPersonRef'
        organizations:
          type:
          - array
          - 'null'
          description: A collection of organizational affiliations.
          items:
            $ref: '#/components/schemas/OrganizationRef'
        role:
          $ref: '#/components/schemas/ClassificationRef'
      description: A supervisor on a research output.
    CustomDefinedFields:
      type:
      - object
      - 'null'
      additionalProperties:
        $ref: '#/components/schemas/CustomDefinedField'
      description: Map of CustomDefinedField values, where the key is the field identifier
      example: '{ "fieldName1": "typeDiscriminator": "Integer", "value" : 1}'
    AllowedKeywordGroupConfiguration:
      required:
      - targetSystemName
      type: object
      properties:
        pureId:
          type: integer
          description: Pure database ID of the object, prefer using the UUID if it is present on the entity
          format: int64
          readOnly: true
        targetSystemName:
          type: string
          description: The content system name this configuration applies to
        keywordGroupType:
          type: string
          description: The OpenAPI schema type of this keyword configuration
          readOnly: true
        name:
          $ref: '#/components/schemas/LocalizedString'
        description:
          $ref: '#/components/schemas/FormattedLocalizedString'
        classificationScheme:
          $ref: '#/components/schemas/ClassificationSchemeRef'
        allowUserdefinedKeywords:
          type: boolean
          description: Defines if user defined keywords are allowed
        limitToLeafSelection:
          type: boolean
        logicalName:
          type: string
        relationType:
          type:
          - string
          - 'null'
          description: The schema name of the type (with the ability to associate keywords) on which the keyword group configuration is related to, e.g. StaffOrganizationAssociation. It can also be set to null (default value), which means the keyword group configuration is related to the main type (the target system name) and not a relation of the main type.
      description: A specification of the allowed behavior of a specified keyword group
    LocalesList:
      type: object
      properties:
        locales:
          pattern: /^[a-z]{2}_[A-Z]{2}$/
          type: array
          description: Allowed locale values for use in localized string entities. The locale format consists of lower-case ISO 639 alpha-2 language code and upper-cased ISO 3166 alpha-2 country code.
          items:
            pattern: /^[a-z]{2}_[A-Z]{2}$/
            type: string
            description: Allowed locale values for use in localized string entities. The locale format consists of lower-case ISO 639 alpha-2 language code and upper-cased ISO 3166 alpha-2 country code.
      description: List of available locales
    Workflow:
      required:
      - step
      type: object
      properties:
        step:
          type: string
          description: Current workflow step
        description:
          $ref: '#/components/schemas/SystemLocalizedString'
      description: Information about workflow
    ImpactRef:
      required:
      - uuid
      type:
      - object
      - 'null'
      description: A reference to impact
      allOf:
      - $ref: '#/components/schemas/ContentRef'
    ActivityRef:
      required:
      - uuid
      type:
      - object
      - 'null'
      description: A reference to an activity
      allOf:
      - $ref: '#/components/schemas/ContentRef'
    StudentThesisDocument:
      required:
      - fileName
      - mimeType
      - type
      - versionType
      - visibility
      type: object
      properties:
        pureId:
          type: integer
          description: Pure database ID of the object, prefer using the UUID if it is present on the entity
          format: int64
          readOnly: true
        fileId:
          type: string
          description: The id of the file
          readOnly: true
        fileName:
          type: string
          description: The documents file name
        mimeType:
          type: string
          description: The documents mime type
        size:
          type: integer
          description: The documents size in bytes
          format: int64
        url:
          type: string
          description: Download url for the binary file
          readOnly: true
        fileStoreLocations:
          type: object
          additionalProperties:
            type: string
            description: Locations of the binary file in file stores.
            readOnly: true
          description: Locations of the binary file in file stores.
          readOnly: true
        uploadedFile:
          $ref: '#/components/schemas/UploadedFile'
        remoteFile:
          $ref: '#/components/schemas/RemoteFile'
        fileData:
          type: string
