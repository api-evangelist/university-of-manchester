  - date: '2026-08-19'
    rating: 2
    summary: >-
      Re-profiled under the university pipeline, which settles operator attribution before saving
      anything. The June 2026 profile scored 36 OpenAPI documents as the University's own; every one
      of them was Elsevier's Pure 5.35.2-2 specification split by tag — info.title "Pure API",
      info.contact.email pure-support@elsevier.com, servers[0].url "/ws/api" naming no institution —
      and DNS confirms pure.manchester.ac.uk and research.manchester.ac.uk both CNAME to
      uom-aws.elsevierpure.com. Those contracts and everything derived from them are quarantined.

      What the University does operate, verified live: a IIIF Presentation API 2.1 and a IIIF Image
      API 2.0 level 1 at Manchester Digital Collections, both on hosts inside the University's own
      JANET address space (130.88.101.74 and .75) with manifests attributed to the University of
      Manchester Library; and a Shibboleth SAML 2.0 Identity Provider whose signed entity descriptor
      is published through the Jisc UK Access Management Federation. Two contracts were written from
      those probes and saved. Three further surfaces are real but tenant-operated — Pure, Research
      Explorer and Figshare — and are recorded as relationships without holding the supplier's spec.

      No open data portal, no central API host, no developer portal, no public course/timetable/SIS
      API. This is a correct thin profile, and the score should fall accordingly.
